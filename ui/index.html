<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penumbra</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Filtros SVG: lente de vidro líquido usada no polegar do slider e nos botões -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage id="lensMap" href="" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="shell" id="shell">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="bubbles" id="bubbles" aria-hidden="true"></div>

    <header class="top" title="Arraste para mover · puxe a borda para redimensionar">
      <div class="brand">
        <img class="logo" src="favicon.svg" alt="" width="24" height="24">
        <h1>Penumbra</h1>
      </div>
      <div class="actions">
        <button class="glass-btn" id="theme" aria-label="Trocar tema" title="Tema">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13.5 9.6A5.7 5.7 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z" fill="currentColor"/></svg>
        </button>
        <button class="glass-btn" id="close" aria-label="Esconder" title="Esconder (Esc)">
          <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="list" id="list" aria-live="polite"></main>

    <footer class="foot" id="foot">
      <div class="all" id="all">
        <span class="all-label">Todas as telas</span>
        <button class="chip" data-all="0">Normal</button>
        <button class="chip" data-all="25">25%</button>
        <button class="chip" data-all="50">50%</button>
        <button class="chip" data-all="75">75%</button>
      </div>
      <div class="hint">Ctrl+Alt+PgDn/PgUp escurece/clareia · Ctrl+Alt+End liga/desliga</div>
    </footer>

    <!-- Bordas e cantos da janela: puxar redimensiona (a interface cresce junto) -->
    <div class="rz rz-w" data-resize="West" aria-hidden="true"></div>
    <div class="rz rz-e" data-resize="East" aria-hidden="true"></div>
    <div class="rz rz-nw" data-resize="NorthWest" aria-hidden="true"></div>
    <div class="rz rz-ne" data-resize="NorthEast" aria-hidden="true"></div>
    <div class="rz rz-sw" data-resize="SouthWest" aria-hidden="true"></div>
    <div class="rz rz-se" data-resize="SouthEast" aria-hidden="true"></div>
  </div>

  <script src="bubbles.js"></script>
  <script src="app.js"></script>
</body>
</html>
